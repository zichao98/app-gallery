<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>App Grove｜Zichao Leng</title>
<meta name="description" content="Zichao Leng 的應用林場：每個應用都是一棵科技樹——收藏白板、投資策劃、六爻排卦、互動技術講解、股票匯率監控、Python 工作流畫布與復古合成器。" />
<meta name="theme-color" content="#f4efe3" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23304a2c'/%3E%3Cpath d='M16 28V15M16 20l-5-4M16 17l5-4' stroke='%23e9e2cf' stroke-width='2.2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='11' r='5' fill='%236f8f4f'/%3E%3Ccircle cx='10' cy='14' r='3.5' fill='%23587a3e'/%3E%3Ccircle cx='22' cy='12' r='3.5' fill='%2389a861'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,400&family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<script>
  // set the light phase before first paint so night visitors don't see a daytime flash
  (() => {
    let m = "auto"; try { m = localStorage.getItem("phase") || "auto"; } catch {}
    const n = new Date(), h = n.getHours() + n.getMinutes() / 60;
    const p = ["dawn", "day", "dusk", "night"].includes(m) ? m : h >= 5 && h < 7.5 ? "dawn" : h >= 7.5 && h < 16.5 ? "day" : h >= 16.5 && h < 19 ? "dusk" : "night";
    document.documentElement.dataset.phase = p;
    document.documentElement.dataset.theme = p === "night" ? "dark" : "light";
  })();
</script>
<style>
  :root {
    /* 白晝 */
    --bg: #f2eee4;
    --bg-2: #faf8f2;
    --surface: rgba(255,253,247,.75);
    --text: #262a22;
    --text-2: #585c4e;
    --text-3: #878a78;
    --border: rgba(50,60,35,.14);
    --border-strong: rgba(50,60,35,.28);
    --moss: #3f6a3a;
    --moss-soft: rgba(63,106,58,.12);

    --sky-1: #b4cbd6;
    --sky-2: #d9e2dc;
    --sky-3: #ece7d9;
    --sun: #fff3d2;
    --sun-glow: .75;
    --ray-op: .5;
    --ridge-1: #c2cfcc;
    --ridge-2: #a8bab3;
    --ridge-3: #8aa093;
    --ridge-4: #6c8570;
    --haze: #e9ebe2;
    --ground-1: #7a8f5c;
    --ground-2: #4f683a;
    --grass-1: #405c2c;
    --grass-2: #62803f;
    --grass-3: #8ea35f;
    --star-op: 0;
    --firefly-op: 0;
    --flora-filter: none;
    --tree-shadow: .28;
    --plaque: #2c372d;
    --plaque-edge: #182019;
    --plaque-text: #efe9d7;
    --plaque-sub: #b3bca6;
    --up: #3f9a4a;
    --down: #b5563f;
    --shadow: 0 24px 60px -30px rgba(40,50,20,.35);
    --ray-c: #fffbe8;
    --moon-shade: 0;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    /* 夜林 */
    --bg: #0b1210;
    --bg-2: #111b17;
    --surface: rgba(20,32,26,.75);
    --text: #e4e8da;
    --text-2: #a4ae9b;
    --text-3: #717d6a;
    --border: rgba(210,230,200,.12);
    --border-strong: rgba(210,230,200,.25);
    --moss: #93b879;
    --moss-soft: rgba(147,184,121,.12);

    --sky-1: #02060d;
    --sky-2: #08131c;
    --sky-3: #0f1c18;
    --sun: #e7e4d4;
    --sun-glow: .35;
    --ray-op: 0;
    --ridge-1: #0d1920;
    --ridge-2: #0c171b;
    --ridge-3: #0b1517;
    --ridge-4: #091311;
    --haze: #10202a;
    --ground-1: #0c1812;
    --ground-2: #060d09;
    --grass-1: #0a170f;
    --grass-2: #112318;
    --grass-3: #19301f;
    --star-op: .85;
    --firefly-op: 1;
    --flora-filter: brightness(.42) saturate(.7);
    --tree-shadow: .5;
    --plaque: #161e18;
    --plaque-edge: #0a0f0b;
    --plaque-text: #d7d1bd;
    --plaque-sub: #7c8773;
    --up: #7fd88a;
    --down: #d97a60;
    --shadow: 0 24px 60px -30px rgba(0,0,0,.8);
    --moon-shade: .14;
    color-scheme: dark;
  }
  /* 日出 */
  :root[data-phase="dawn"] {
    --sky-1: #7d95b8; --sky-2: #dcbfb6; --sky-3: #f4d2a2;
    --sun: #ffd496; --sun-glow: .95; --ray-op: .6; --ray-c: #ffdcaa;
    --ridge-1: #b6b0c2; --ridge-2: #9b98ab; --ridge-3: #7c8786; --ridge-4: #61735d;
    --haze: #f0d9c6;
    --ground-1: #6f8456; --ground-2: #44573a;
    --grass-1: #3b5530; --grass-2: #5a7540; --grass-3: #879a5c;
    --flora-filter: brightness(.9) sepia(.16) saturate(1.05);
    --tree-shadow: .2; --star-op: .12;
  }
  /* 日落 */
  :root[data-phase="dusk"] {
    --sky-1: #3d4776; --sky-2: #c7877b; --sky-3: #f0ad68;
    --sun: #ffa65a; --sun-glow: 1; --ray-op: .65; --ray-c: #ffc283;
    --ridge-1: #8a7792; --ridge-2: #6e6079; --ridge-3: #55505a; --ridge-4: #40423a;
    --haze: #e8b18a;
    --ground-1: #58653f; --ground-2: #2f3824;
    --grass-1: #2b3a20; --grass-2: #46562f; --grass-3: #6f7a45;
    --flora-filter: brightness(.74) sepia(.3) saturate(1.15) hue-rotate(-8deg);
    --tree-shadow: .3; --star-op: .25;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font-family: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    transition: background-color .6s ease, color .6s ease;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--moss); outline-offset: 3px; border-radius: 6px; }
  .serif { font-family: "Fraunces", "Noto Serif TC", serif; }
  .wrap { width: min(1180px, 100% - 32px); margin-inline: auto; }

  /* ---------- Nav ---------- */
  header.nav {
    position: sticky; top: 0; z-index: 30;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    background: color-mix(in srgb, var(--bg) 72%, transparent);
    border-bottom: 1px solid transparent; transition: border-color .3s;
  }
  header.nav.scrolled { border-bottom-color: var(--border); }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 62px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
  .brand svg { width: 28px; height: 28px; }
  .nav-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border);
    transition: border-color .2s, transform .2s;
  }
  .icon-btn:hover { border-color: var(--border-strong); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn svg { width: 18px; height: 18px; }
  .nav-actions { align-items: center; }
  .phase-label { font-size: 13px; color: var(--text-3); margin-right: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (max-width: 640px) { .phase-label { display: none; } }
  @media (max-width: 480px) { .nav-actions > a.icon-btn { display: none; } }
  .phase-ctl {
    display: flex; gap: 2px; padding: 3px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
  }
  .phase-ctl button {
    width: 32px; height: 32px; border-radius: 50%; border: 0; background: transparent; cursor: pointer;
    display: grid; place-items: center; color: var(--text-2); transition: background .25s, color .25s;
  }
  .phase-ctl button:hover { color: var(--text); background: var(--moss-soft); }
  .phase-ctl button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .phase-ctl svg { width: 17px; height: 17px; }

  /* ---------- Hero ---------- */
  .hero { padding: clamp(40px, 7vw, 76px) 0 8px; text-align: center; position: relative; z-index: 2; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 12px; color: var(--text-2); letter-spacing: .22em;
  }
  .eyebrow::before, .eyebrow::after { content: ""; width: 28px; height: 1px; background: var(--border-strong); }
  h1 {
    margin: 16px auto 14px;
    font-family: "Noto Serif TC", serif; font-weight: 900;
    font-size: clamp(36px, 6.6vw, 68px); line-height: 1.14; letter-spacing: .02em;
  }
  h1 em { font-style: normal; color: var(--moss); }
  .lede { margin: 0 auto; max-width: 540px; color: var(--text-2); font-size: clamp(15px, 2vw, 17px); line-height: 1.8; }
  .stats { display: flex; justify-content: center; gap: clamp(24px, 6vw, 64px); margin-top: 26px; flex-wrap: wrap; }
  .stat b { display: block; font-family: "Fraunces", serif; font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--text-3); }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
    margin: 30px auto 0; position: relative; z-index: 3;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--border); background: var(--surface);
    padding: 7px 14px; border-radius: 999px; font-size: 14px;
    cursor: pointer; color: var(--text-2);
    transition: background .25s, color .25s, border-color .25s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip:hover { color: var(--text); border-color: var(--border-strong); }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: transparent; }
  .chip .count { font-size: 12px; opacity: .65; font-variant-numeric: tabular-nums; }
  .search { position: relative; flex: 1 1 220px; max-width: 300px; }
  .search input {
    width: 100%; height: 40px; padding: 0 40px 0 38px;
    border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font: inherit; font-size: 14px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .search input::placeholder { color: var(--text-3); }
  .search input:focus { border-color: var(--moss); box-shadow: 0 0 0 4px var(--moss-soft); }
  .search > svg { position: absolute; left: 13px; top: 50%; translate: 0 -50%; width: 16px; height: 16px; color: var(--text-3); }
  .kbd {
    position: absolute; right: 12px; top: 50%; translate: 0 -50%;
    font: 500 11px "JetBrains Mono", monospace; color: var(--text-3);
    border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px;
  }

  /* ---------- Forest scene ---------- */
  .forest-wrap { position: relative; margin-top: 4px; }
  .forest {
    overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
    -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
  }
  .forest::-webkit-scrollbar { display: none; }
  .scene { position: relative; min-width: 1100px; }
  .scene > svg { display: block; width: 100%; height: auto; animation: fadeIn 1.4s ease both; }
  @keyframes fadeIn { from { opacity: 0; } }
  .scroll-hint { display: none; text-align: center; font-size: 12px; color: var(--text-3); margin-top: 6px; }
  @media (max-width: 1100px) { .scroll-hint { display: block; } }

  /* drifting mist (HTML layers so they animate without repainting the SVG) */
  .mist {
    position: absolute; left: -30%; width: 160%; pointer-events: none;
    background: radial-gradient(ellipse 50% 50% at 50% 50%, color-mix(in srgb, var(--haze) 75%, transparent), transparent 70%);
    will-change: transform; opacity: .9;
    animation: drift 46s ease-in-out infinite alternate;
  }
  .mist.m1 { top: 50%; height: 16%; }
  .mist.m2 { top: 63%; height: 12%; opacity: .7; animation-duration: 60s; animation-direction: alternate-reverse; }
  :root[data-theme="dark"] .mist { opacity: .55; }
  @keyframes drift { from { transform: translateX(-7%); } to { transform: translateX(7%); } }

  .sky-1 { stop-color: var(--sky-1); } .sky-2 { stop-color: var(--sky-2); } .sky-3 { stop-color: var(--sky-3); }
  .bg-stop { stop-color: var(--bg); }
  .haze-stop { stop-color: var(--haze); }
  .sun-stop { stop-color: var(--sun); }
  .ray-stop { stop-color: var(--ray-c); }
  .sun-disk { fill: var(--sun); }
  .sun-bloom { opacity: var(--sun-glow); }
  .moon-shade { fill: #5d5a4c; opacity: var(--moon-shade); }
  .rays { opacity: var(--ray-op); mix-blend-mode: soft-light; }
  .r1 { fill: var(--ridge-1); } .r2 { fill: var(--ridge-2); } .r3 { fill: var(--ridge-3); } .r4 { fill: var(--ridge-4); }
  .g1 { stop-color: var(--ground-1); } .g2 { stop-color: var(--ground-2); }
  .gr1 { stroke: var(--grass-1); } .gr2 { stroke: var(--grass-2); } .gr3 { stroke: var(--grass-3); }
  .grass { fill: none; stroke-width: 1.3; stroke-linecap: round; }
  .star { fill: #f1eedc; opacity: var(--star-op); }
  /* smooth light changes between phases */
  .sky-1, .sky-2, .sky-3, .haze-stop, .sun-stop, .ray-stop, .g1, .g2, .bg-stop { transition: stop-color 1.8s ease; }
  .r1, .r2, .r3, .r4, .sun-disk { transition: fill 1.8s ease; }
  .grass { transition: stroke 1.8s ease; }
  .star, .sun-bloom, .rays, .moon-shade, .flora .tshadow { transition: opacity 1.8s ease; }
  #sunG, #raysG { transform-box: view-box; transition: transform 2.4s cubic-bezier(.4,0,.2,1); }
  .flora .tshadow { transition: opacity 1.8s, cx 2.4s, rx 2.4s; }

  /* ---------- Fauna ---------- */
  .fauna { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .cr { position: absolute; opacity: 0; transition: opacity 1.6s ease; }
  .cr, .cr * { animation-play-state: paused !important; }
  :root[data-phase="dawn"] .cr[data-when~="dawn"], :root[data-phase="day"] .cr[data-when~="day"],
  :root[data-phase="dusk"] .cr[data-when~="dusk"], :root[data-phase="night"] .cr[data-when~="night"] { opacity: 1; }
  :root[data-phase="dawn"] .cr[data-when~="dawn"], :root[data-phase="dawn"] .cr[data-when~="dawn"] *,
  :root[data-phase="day"] .cr[data-when~="day"], :root[data-phase="day"] .cr[data-when~="day"] *,
  :root[data-phase="dusk"] .cr[data-when~="dusk"], :root[data-phase="dusk"] .cr[data-when~="dusk"] *,
  :root[data-phase="night"] .cr[data-when~="night"], :root[data-phase="night"] .cr[data-when~="night"] * { animation-play-state: running !important; }
  .cr svg { display: block; overflow: visible; }

  .butterfly .path { animation: flutter var(--dur, 14s) ease-in-out infinite; animation-delay: var(--dl, 0s); }
  .butterfly .bob { animation: bob 1.1s ease-in-out infinite alternate; }
  .butterfly .wing { transform-box: view-box; transform-origin: 0 0; animation: flap .17s ease-in-out infinite alternate; }
  @keyframes flap { to { transform: scaleX(.22); } }
  @keyframes bob { to { transform: translateY(-5px) rotate(6deg); } }
  @keyframes flutter {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(var(--ax), var(--ay)); }
    50% { transform: translate(var(--bx), var(--by)); }
    75% { transform: translate(var(--cx), var(--cy)); }
  }

  .dragonfly .path { animation: dart var(--dur, 11s) cubic-bezier(.2,.9,.3,1) infinite; animation-delay: var(--dl, 0s); }
  .dragonfly .hover { animation: bob .6s ease-in-out infinite alternate; }
  .dragonfly .dwing { animation: shimmer .05s linear infinite alternate; }
  @keyframes shimmer { to { opacity: .35; } }
  @keyframes dart {
    0%, 16% { transform: translate(0, 0) scaleX(1); }
    20%, 38% { transform: translate(var(--ax), var(--ay)) scaleX(1); }
    42%, 60% { transform: translate(var(--bx), var(--by)) scaleX(-1); }
    64%, 82% { transform: translate(var(--cx), var(--cy)) scaleX(-1); }
    86%, 100% { transform: translate(0, 0) scaleX(1); }
  }

  .bat { left: 0; width: 100%; height: 0; animation: fly var(--dur, 16s) linear infinite; animation-delay: var(--dl, 0s); }
  .bat.rev { animation-direction: reverse; }
  .bat.rev svg { transform: scaleX(-1); }
  .bat .swoop { width: 30px; animation: swoop var(--sw, 3.2s) ease-in-out infinite; }
  .bat .bw { transform-box: view-box; transform-origin: 0 0; animation: batflap .13s ease-in-out infinite alternate; }
  @keyframes batflap { to { transform: scaleY(-.45); } }
  @keyframes fly { from { transform: translateX(-4%); } to { transform: translateX(104%); } }
  @keyframes swoop { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(34px); } 60% { transform: translateY(-18px); } 80% { transform: translateY(22px); } }

  .owl { opacity: 0; transition: opacity 1.6s ease; }
  :root[data-phase="night"] .owl, :root[data-phase="dusk"] .owl { opacity: 1; }
  .owl .eye { fill: #f3c33a; }
  :root[data-phase="night"] .owl .eye { filter: drop-shadow(0 0 2px #f3c33a); }
  .owl .lid { transform-box: fill-box; transform-origin: 50% 0; transform: scaleY(0); animation: blinkOwl 6s infinite; }
  .owl .head { transform-box: fill-box; transform-origin: 50% 90%; animation: turn 11s ease-in-out infinite; }
  @keyframes blinkOwl { 0%, 93%, 100% { transform: scaleY(0); } 95%, 97% { transform: scaleY(1); } }
  @keyframes turn { 0%, 35%, 100% { transform: rotate(0); } 45%, 60% { transform: rotate(-14deg); } 70%, 85% { transform: rotate(10deg); } }
  .firefly { fill: #f2efa0; opacity: 0; }
  :root[data-theme="dark"] .firefly { animation: blink var(--d, 4s) ease-in-out infinite, wander var(--w, 9s) ease-in-out infinite alternate; animation-delay: var(--dl, 0s); }
  @keyframes blink { 0%,100% { opacity: 0; } 45%,55% { opacity: .95; } }
  @keyframes wander { to { transform: translate(var(--tx, 20px), var(--ty, -24px)); } }

  .flora { filter: var(--flora-filter); transition: opacity .45s ease, filter .6s; }
  .flora .tshadow { opacity: var(--tree-shadow); }
  .flora .glint { fill: #fff9e0; opacity: .0; transition: opacity .4s; }
  :root[data-theme="dark"] .flora .glint { opacity: .9; }
  .flora.fade { opacity: .22; }
  .flora.dim { opacity: .15; }

  .ov { cursor: pointer; outline: none; }
  .ov .hit { fill: transparent; }
  .ov .skel { opacity: 0; transition: opacity .4s ease; pointer-events: none; }
  .ov.active .skel { opacity: 1; }
  .ov .sk-halo { fill: none; stroke: var(--bg); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; opacity: .75; }
  .ov .sk-line { fill: none; stroke: var(--leaf); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .ov .sk-node { fill: var(--leaf); stroke: var(--bg); stroke-width: 2.5; }
  .ov .sk-root { fill: var(--bg); stroke: var(--leaf); stroke-width: 3; }
  .ov .sk-feat { fill: var(--leaf); stroke: var(--bg); stroke-width: 1.8; }
  :root[data-theme="dark"] .ov.active .skel { filter: drop-shadow(0 0 5px var(--leaf)); }
  .ov .blabel {
    font: 700 14px "Noto Sans TC", sans-serif; fill: var(--text);
    paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round;
  }
  .ov .plaque rect.pl { fill: var(--plaque); stroke: var(--plaque-edge); stroke-width: 1; transition: fill .6s; }
  .ov .plaque rect.post { fill: var(--plaque-edge); }
  .ov .plaque .pn { fill: var(--plaque-text); font: 700 13.5px "Noto Sans TC", sans-serif; }
  .ov .plaque .pl2 { fill: var(--plaque-sub); font: italic 400 11.5px "Fraunces", serif; }
  .ov .plaque .pdot { fill: var(--plaque-sub); }
  .ov[data-s="up"] .plaque .pdot { fill: var(--up); }
  .ov[data-s="down"] .plaque .pdot { fill: var(--down); }
  .ov:focus-visible .plaque rect.pl, .ov.active .plaque rect.pl { stroke: var(--leaf); stroke-width: 2; }
  .ov.dim { opacity: .25; }

  /* ---------- Registry (list) ---------- */
  .registry { padding: 56px 0 30px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .section-head h2 { margin: 0; font-family: "Noto Serif TC", serif; font-size: 26px; font-weight: 700; }
  .section-head p { margin: 0; color: var(--text-3); font-size: 14px; }
  .rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }

      desc: "在瀏覽器裡玩的復古點陣風格合成器：雙振盪器、濾波包絡、LFO、失真與位元破碎效果、琶音器、16 步編曲器，支援電腦鍵盤與 MIDI。附 Studio：可拖拽編排的時間軸，跟著逐步教學做出自己的 EDM 並錄音下載。",
      url: "https://dot-synth.zichaoleng55.workers.dev/",
      branches: [["音源", ["雙振盪器", "濾波包絡", "LFO"]], ["效果", ["失真", "位元破碎"]], ["編曲", ["琶音器", "16 步編曲器"]], ["演奏", ["電腦鍵盤", "MIDI"]], ["Studio", ["時間軸", "EDM 教學", "錄音下載"]]] },
  ];

  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const leafCount = a => a.branches.reduce((n, b) => n + b[1].length, 0);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const f = n => (Math.round(n * 10) / 10).toString();
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // seeded random so each tree always grows the same way
  function rng(seed) {
    let h = 2166136261; for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
    return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; };
  }
  const circ = (x, y, r) => `M${f(x - r)} ${f(y)}a${f(r)} ${f(r)} 0 1 0 ${f(2 * r)} 0a${f(r)} ${f(r)} 0 1 0 ${f(-2 * r)} 0`;
  const ell = (x, y, rx, ry) => `M${f(x - rx)} ${f(y)}a${f(rx)} ${f(ry)} 0 1 0 ${f(2 * rx)} 0a${f(rx)} ${f(ry)} 0 1 0 ${f(-2 * rx)} 0`;

  // ---------- Scene geometry ----------
  const VW = 1760, VH = 800, SPACING = 232, X0 = (VW - SPACING * (APPS.length - 1)) / 2;
  const groundY = x => 668 + 7 * Math.sin(x / 170) + 4 * Math.sin(x / 67 + 1);

  // ---------- Tree generator ----------
  function buildTree(a, i) {
    const sp = SPECIES[a.sp], r = rng(a.id);
    const x = X0 + i * SPACING + (r() - .5) * 16, g = groundY(x);
    const H = Math.round(sp.h * (320 + leafCount(a) * 6));
    const W = sp.trunk;
    const lean = (r() - .5) * 18;
    const fx = x + lean, fy = g - H * sp.fork;
    const crownH = fy - (g - H);
    const segs = [], clumps = [], mains = [];

    function grow(x0, y0, ang, len, w, depth, maxD, chain, bucket) {
      const ex = x0 + Math.sin(ang) * len, ey = y0 - Math.cos(ang) * len;
      const bend = (r() - .5) * len * .28;
      const cx = (x0 + ex) / 2 + Math.cos(ang) * bend, cy = (y0 + ey) / 2 + Math.sin(ang) * bend;
      segs.push([x0, y0, cx, cy, ex, ey, w, w * .68]);
      const ch = chain.concat([[cx, cy], [ex, ey]]);
      if (depth >= maxD) {
        bucket.push({ x: ex, y: ey, chain: ch });
        clumps.push([ex + Math.sin(ang) * sp.clumpR * .25, ey - sp.clumpR * .2, sp.clumpR * (.85 + r() * .35)]);
        return [ex, ey];
      }
      if (depth >= 1) clumps.push([ex, ey - 4, sp.clumpR * (.7 + r() * .25)]);
      const kids = depth === 0 && r() < .35 ? 3 : 2;
      for (let c = 0; c < kids; c++) {
        const off = kids === 2 ? (c ? 1 : -1) * (.26 + r() * .3) : (c - 1) * (.38 + r() * .2);
        const na = clamp((ang + off) * (1 - sp.up), -1.75, 1.75);
        grow(ex, ey, na, len * (.66 + r() * .12), w * .64, depth + 1, maxD, ch, bucket);
      }
      return [ex, ey];
    }

    const k = a.branches.length;
    a.branches.forEach(([bn, feats], bi) => {
      const t = k === 1 ? 0 : -1 + 2 * bi / (k - 1);
      const ang = t * sp.spread + (r() - .5) * .18;
      const sx = fx + t * W * .45, sy = fy + Math.abs(t) * 16 + r() * 10;
      const len = crownH * (.29 + .12 * (1 - Math.abs(t)));
      const maxD = feats.length > 4 ? 3 : 2;
      const bucket = [];
      const end = grow(sx, sy, ang, len, W * .66, 0, maxD, [[sx, sy]], bucket);
      const T = bucket.length, m = feats.length;
      const chosen = feats.map((_, li) => bucket[Math.min(T - 1, Math.round((li + .5) * T / m - .5))]);
      mains.push({ name: bn, feats, end, ang, t, chosen, start: [sx, sy] });
    });
    // fill the middle of the crown
    clumps.push([fx, fy - crownH * .5, sp.clumpR * 1.35]);
    clumps.push([fx + (r() - .5) * 30, fy - crownH * .78, sp.clumpR * 1.1]);

    const ccx = clumps.reduce((s, c) => s + c[0], 0) / clumps.length;
    const ccy = clumps.reduce((s, c) => s + c[1], 0) / clumps.length;
    const crownR = Math.max(...clumps.map(c => Math.hypot(c[0] - ccx, c[1] - ccy))) || 1;
    const crownW = Math.max(...clumps.map(c => Math.abs(c[0] - ccx) + c[2])) * 2;

    // --- trunk ---
    const trunk = `M${f(x - W * 1.8)} ${f(g + 3)} Q${f(x - W * 1.05)} ${f(g - 5)} ${f(x - W)} ${f(g - 24)}
      C${f(x - W * .95 + lean * .3)} ${f(g - (g - fy) * .5)} ${f(fx - W * .72)} ${f(fy + 34)} ${f(fx - W * .6)} ${f(fy)}
      L${f(fx + W * .6)} ${f(fy)} C${f(fx + W * .72)} ${f(fy + 34)} ${f(x + W * .95 + lean * .3)} ${f(g - (g - fy) * .5)} ${f(x + W)} ${f(g - 24)}
      Q${f(x + W * 1.05)} ${f(g - 5)} ${f(x + W * 1.8)} ${f(g + 3)} Z`;
    let barkLines = "";
    for (let j = 0; j < (sp.birch ? 0 : 6); j++) {
      const o = (r() - .5) * 1.5 * W, top = .2 + r() * .7;
      barkLines += `M${f(x + o)} ${f(g - 4)} Q${f(x + o * .8 + lean * .3 + (r() - .5) * 4)} ${f(g - (g - fy) * top * .5)} ${f(x + o * .6 + lean * top)} ${f(g - (g - fy) * top)}`;
    }
    let birchMarks = "";
    if (sp.birch) {
      for (let j = 0; j < 22; j++) {
        const tt = r(), yy = g - 10 - (g - fy) * tt, cxm = x + lean * tt, half = W * (1 - tt * .4);
        const w = half * (.35 + r() * .7), side = r() > .5 ? 1 : -1;
        const x0 = side > 0 ? cxm + half - w : cxm - half;
        birchMarks += `M${f(x0)} ${f(yy)}h${f(w)}v${f(1.4 + r() * 1.8)}h${f(-w)}Z`;
      }
    }

    // --- branches (one aggregated path) ---
    let br = "";
    segs.forEach(([x0, y0, cx, cy, ex, ey, w0, w1]) => {
      const dx = ex - x0, dy = ey - y0, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
      const wm = (w0 + w1) / 4;
      br += `M${f(x0 + nx * w0 / 2)} ${f(y0 + ny * w0 / 2)}Q${f(cx + nx * wm)} ${f(cy + ny * wm)} ${f(ex + nx * w1 / 2)} ${f(ey + ny * w1 / 2)}L${f(ex - nx * w1 / 2)} ${f(ey - ny * w1 / 2)}Q${f(cx - nx * wm)} ${f(cy - ny * wm)} ${f(x0 - nx * w0 / 2)} ${f(y0 - ny * w0 / 2)}Z`;
      br += circ(ex, ey, w1 / 2);
    });

    // --- foliage (aggregated per shade for speed) ---
    const shades = ["", "", "", "", ""], under = ["", ""], rac = ["", "", "", ""];
    const flat = sp.pad ? .5 : 1;
    clumps.forEach(([cx, cy, R]) => {
      // lumpy under-layer: several small blobs instead of one hard-edged circle
      for (let q = 0; q < 7; q++) {
        const rr = R * .5 * Math.sqrt(r()), th = r() * Math.PI * 2, rad = R * (.32 + r() * .2);
        under[0] += ell(cx + Math.cos(th) * rr, cy + Math.sin(th) * rr * flat, rad, rad * flat);
      }
      for (let q = 0; q < 4; q++) {
        const rr = R * .35 * Math.sqrt(r()), th = r() * Math.PI * 2, rad = R * (.22 + r() * .14);
        under[1] += ell(cx + R * .2 + Math.cos(th) * rr, cy - R * .2 * flat + Math.sin(th) * rr * flat, rad, rad * flat);
      }
      const n = Math.round(sp.density * 1.35 * (R / sp.clumpR) ** 1.6);
      for (let j = 0; j < n; j++) {
        const rr = R * 1.05 * Math.sqrt(r()), th = r() * Math.PI * 2;
        const dx = Math.cos(th) * rr, dy = Math.sin(th) * rr * flat;
        const px = cx + dx, py = cy + dy;
        let light = .5 + .42 * ((dx * .6 - dy * .8) / R) + .3 * (((cx - ccx) * .5 - (cy - ccy) * .85) / crownR) + (r() - .5) * .38;
        const idx = clamp(Math.floor(light * 5), 0, 4);
        if (sp.leaf === "blossom") {
          shades[idx] += circ(px, py, 1.8 + r() * 1.6);
        } else if (sp.leaf === "needle") {
          for (let q = 0; q < 4; q++) {
            const a2 = -Math.PI / 2 + (r() - .5) * 2.6, l = 5 + r() * 4;
            shades[idx] += `M${f(px)} ${f(py)}l${f(Math.cos(a2) * l)} ${f(Math.sin(a2) * l * .6)}`;
          }
        } else {
          const a2 = r() * Math.PI, l = sp.leaf === "fan" ? 3.2 + r() * 2 : 3.6 + r() * 2.8, w = sp.leaf === "fan" ? l * .75 : l * .45;
          const ux = Math.cos(a2), uy = Math.sin(a2);
          shades[idx] += `M${f(px - ux * l)} ${f(py - uy * l)}Q${f(px - uy * w)} ${f(py + ux * w)} ${f(px + ux * l)} ${f(py + uy * l)}Q${f(px + uy * w)} ${f(py - ux * w)} ${f(px - ux * l)} ${f(py - uy * l)}Z`;
        }
      }
      if (sp.racemes) {
        const nR = 2 + Math.floor(r() * 3);
        for (let q = 0; q < nR; q++) {
          let rx = cx + (r() - .5) * R * 1.5, ry = cy + R * (.35 + r() * .3);
          const cnt = 6 + Math.floor(r() * 6);
          for (let s = 0; s < cnt; s++) {
            const rad = 2.8 - s * (1.7 / cnt);

          }
        }

    });

    let glints = "";
    mains.forEach(mn => mn.chosen.forEach(tp => glints += circ(tp.x, tp.y - 2, 2.2)));

    const needle = sp.leaf === "needle";
    const leafPaths = shades.map((d, j) => needle
      ? `<path d="${d}" fill="none" stroke="${sp.pal[j]}" stroke-width="1.4" stroke-linecap="round"/>`
      : `<path d="${d}" fill="${sp.pal[j]}"/>`).join("");
    const flora = `<g class="flora" data-i="${i}">
      <ellipse class="tshadow" data-x="${f(fx)}" data-rx="${f(crownW * .42)}" cx="${f(fx + 14)}" cy="${f(g + 4)}" rx="${f(crownW * .42)}" ry="13" fill="url(#tshadow)"/>
      <path d="${trunk}" fill="url(#bark-${a.sp})"/>
      ${barkLines ? `<path d="${barkLines}" fill="none" stroke="${sp.bark[0]}" stroke-width="1.2" opacity=".55"/>` : ""}
      ${birchMarks ? `<path d="${birchMarks}" fill="#2e2822" opacity=".7"/>` : ""}
      <path d="${br}" fill="${sp.bark[2]}"/>
      <path d="${under[0]}" fill="${sp.pal[0]}"/>
      <path d="${under[1]}" fill="${sp.pal[1]}" opacity=".85"/>
      ${leafPaths}
      ${sp.racemes ? rac.map((d, j) => `<path d="${d}" fill="${sp.racemes[j]}"/>`).join("") : ""}
      <path class="glint" d="${glints}"/>

    // --- overlay: tech-tree skeleton, labels, plaque, hit area ---
    let halo = `M${f(x)} ${f(g)}L${f(fx)} ${f(fy)}`, dots = "", labels = "";
    mains.forEach(mn => {
      halo += `M${f(fx)} ${f(fy)}L${f(mn.start[0])} ${f(mn.start[1])}`;
      mn.chosen.forEach(tp => {
        halo += tp.chain.map((p, j) => (j ? "L" : "M") + f(p[0]) + " " + f(p[1])).join("");

    });
    mains.forEach(mn => {
      mn.chosen.forEach((tp, li) => dots += `<circle class="sk-feat" cx="${f(tp.x)}" cy="${f(tp.y)}" r="4.2"><title>${esc(mn.name)} · ${esc(mn.feats[li])}</title></circle>`);
      const [nx, ny] = mn.end;

    const latW = sp.latin.length * 5.9;
    const pw = Math.max(nameW, latW) + 40, py = g + 26;
    const plaque = `<g class="plaque">
      <rect class="post" x="${f(x - 2)}" y="${f(g + 6)}" width="4" height="24"/>
      <rect class="pl" x="${f(x - pw / 2)}" y="${f(py)}" width="${f(pw)}" height="42" rx="3"/>
      <circle class="pdot" cx="${f(x - pw / 2 + 13)}" cy="${f(py + 15)}" r="3.5"/>
      <text class="pn" x="${f(x - pw / 2 + 24)}" y="${f(py + 19.5)}">${esc(a.name)}</text>
      <text class="pl2" x="${f(x - pw / 2 + 24)}" y="${f(py + 34)}">${esc(sp.latin)}</text>
    </g>`;

    const over = `<g class="ov" data-i="${i}" data-s="pending" tabindex="0" role="button"
        aria-label="${esc(a.name)}（${esc(a.sub)}）— 打開觀察筆記" style="--leaf:${a.leaf}">
      <rect class="hit" x="${f(x - SPACING / 2)}" y="${f(g - H - 30)}" width="${SPACING}" height="${f(H + 110)}"/>
      <g class="skel"><path class="sk-halo" d="${halo}"/><path class="sk-line" d="${halo}"/>${dots}${labels}</g>
      ${plaque}
    </g>`;
    // night visitor: an owl perched on the oak's first main branch
    let owl = "";
    if (a.sp === "oak") {
      const [x0, y0, cx, cy, ex, ey, w0, w1] = segs[0], t = .62, u = 1 - t;
      const px = u * u * x0 + 2 * u * t * cx + t * t * ex, py = u * u * y0 + 2 * u * t * cy + t * t * ey - (w0 + (w1 - w0) * t) / 2 + 1;
      owl = `<g class="owl" transform="translate(${f(px)} ${f(py)})" aria-hidden="true">
        <path d="M-3 -1 L0 7 L3 -1Z" fill="#3e2f22"/>
        <path d="M-9 0 C-13 -12 -11 -27 0 -28 C11 -27 13 -12 9 0 Z" fill="#4f3d2c"/>
        <path d="M-6 -2 C-8 -10 -6 -17 0 -18 C6 -17 8 -10 6 -2 Z" fill="#8c7253"/>
        <path d="M-4 -12h2.5M1.5 -9h2.5M-3 -6h2M2 -14h2" stroke="#4f3d2c" stroke-width=".9" stroke-linecap="round"/>
        <g class="head">
          <path d="M-10 -22 C-11 -30 -7 -34 0 -34 C7 -34 11 -30 10 -22 C8 -17 -8 -17 -10 -22Z" fill="#5a4632"/>
          <path d="M-9 -31 L-11 -38 L-5 -33Z M9 -31 L11 -38 L5 -33Z" fill="#4a3826"/>
          <ellipse cx="0" cy="-24.5" rx="8.5" ry="6" fill="#7b6449"/>
          <circle class="eye" cx="-3.8" cy="-25" r="2.8"/><circle class="eye" cx="3.8" cy="-25" r="2.8"/>
          <circle cx="-3.8" cy="-25" r="1.3" fill="#120d08"/><circle cx="3.8" cy="-25" r="1.3" fill="#120d08"/>
          <rect class="lid" x="-6.8" y="-28" width="6" height="6" rx="2.5" fill="#5a4632"/><rect class="lid" x=".8" y="-28" width="6" height="6" rx="2.5" fill="#5a4632"/>
          <path d="M-1.1 -22.5 L0 -19.8 L1.1 -22.5Z" fill="#d6ad62"/>
        </g>
        <path d="M-3 0v2M3 0v2M-4.5 1.5l1.5.5M4.5 1.5l-1.5.5" stroke="#c9a15a" stroke-width="1.3" stroke-linecap="round"/>
      </g>`;
    }
    return { flora, over, owl };
  }

  function ridge(base, amp, freq, phase, treeProb, treeH, seed) {
    const r = rng(seed);
    let d = `M0 ${VH}L0 ${f(base)}`;
    let x = 0;
    const y = xx => base - amp * Math.sin(xx / freq + phase) - amp * .35 * Math.sin(xx / (freq * .37) + phase * 2);
    while (x < VW) {
      const step = 5 + r() * 8;
      if (r() < treeProb) {
        const h = treeH * (.5 + r() * .7), w = h * (.22 + r() * .1), yy = y(x);
        if (r() < .75) { // conifer
          d += `L${f(x)} ${f(yy)}L${f(x + w * .5)} ${f(yy - h * .45)}L${f(x + w * .35)} ${f(yy - h * .45)}L${f(x + w)} ${f(yy - h)}L${f(x + w * 1.65)} ${f(yy - h * .45)}L${f(x + w * 1.5)} ${f(yy - h * .45)}L${f(x + w * 2)} ${f(yy)}`;
        } else {
          d += `L${f(x)} ${f(yy)}Q${f(x + w * 1.4)} ${f(yy - h * 1.1)} ${f(x + w * 2.8)} ${f(yy)}`;
          x += w * .8;
        }
        x += w * 2;
      } else {
        x += step;
        d += `L${f(x)} ${f(y(x))}`;
      }
    }
    return d + `L${VW} ${VH}Z`;
  }

  function sceneSVG() {
    const r = rng("forest-scene");
    const parts = APPS.map(buildTree);
    const sunX = VW * .78, sunY = 170;

    let ground = `M0 ${VH}`;
    for (let x = 0; x <= VW; x += 16) ground += `L${x} ${f(groundY(x))}`;
    ground += `L${VW} ${VH}Z`;

    const grass = ["", "", ""];
    for (let j = 0; j < 1400; j++) {
      const gx = r() * VW, depth = r(), gy = groundY(gx) + 2 + depth * (VH - groundY(gx) - 20);
      const h = 5 + depth * 16 + r() * 8, lean = (r() - .5) * h * .8;
      const idx = clamp(Math.floor((1 - depth) * 2.2 + r() * 1.2), 0, 2);
      grass[idx] += `M${f(gx)} ${f(gy)}q${f(lean * .2)} ${f(-h * .6)} ${f(lean)} ${f(-h)}`;
    }

    let stars = "";
    for (let j = 0; j < 90; j++) stars += circ(r() * VW, r() * 380, .5 + r() * 1.1);

    // rays are drawn pointing straight down from (0,0); JS moves and rotates them toward the forest
    let rays = "";
    for (let j = 0; j < 7; j++) {
      const a1 = Math.PI / 2 - .55 + j * .17 + r() * .05, a2 = a1 + .04 + r() * .06, L = 1100;
      rays += `M0 0L${f(Math.cos(a1) * L)} ${f(Math.sin(a1) * L)}L${f(Math.cos(a2) * L)} ${f(Math.sin(a2) * L)}Z`;
    }

    let flies = "";
    for (let j = 0; j < 34; j++) {
      const fx = r() * VW, fy = 300 + r() * 380;
      flies += `<circle class="firefly" cx="${f(fx)}" cy="${f(fy)}" r="${f(1.4 + r() * 1.4)}" style="--d:${f(2.5 + r() * 3)}s;--w:${f(6 + r() * 6)}s;--dl:${f(-r() * 6)}s;--tx:${f((r() - .5) * 60)}px;--ty:${f((r() - .5) * 50)}px"/>`;
    }

    const barkDefs = Object.entries(SPECIES).map(([k, s]) =>
      `<linearGradient id="bark-${k}" x1="0" x2="1"><stop offset="0" stop-color="${s.bark[0]}"/><stop offset=".38" stop-color="${s.bark[1]}"/><stop offset=".7" stop-color="${s.bark[2]}"/><stop offset="1" stop-color="${s.bark[0]}"/></linearGradient>`).join("");

    return `<svg viewBox="0 0 ${VW} ${VH}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="林場：${APPS.length} 棵科技樹">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="sky-1"/><stop offset=".45" class="sky-2"/><stop offset=".75" class="sky-3"/></linearGradient>
        <linearGradient id="gnd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="g1"/><stop offset="1" class="g2"/></linearGradient>
        <radialGradient id="bloom"><stop offset="0" class="sun-stop" stop-opacity=".9"/><stop offset=".25" class="sun-stop" stop-opacity=".35"/><stop offset="1" class="sun-stop" stop-opacity="0"/></radialGradient>
        <linearGradient id="rayg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="760"><stop offset="0" class="ray-stop" stop-opacity=".9"/><stop offset="1" class="ray-stop" stop-opacity="0"/></linearGradient>
        <linearGradient id="hazeBand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="haze-stop" stop-opacity="0"/><stop offset=".55" class="haze-stop" stop-opacity=".75"/><stop offset="1" class="haze-stop" stop-opacity="0"/></linearGradient>
        <radialGradient id="tshadow"><stop offset="0" stop-color="#000" stop-opacity=".7"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
        <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="bg-stop" stop-opacity="1"/><stop offset=".16" class="bg-stop" stop-opacity="0"/></linearGradient>
        <linearGradient id="fadeBot" x1="0" y1="0" x2="0" y2="1"><stop offset=".93" class="bg-stop" stop-opacity="0"/><stop offset="1" class="bg-stop" stop-opacity="1"/></linearGradient>
        <linearGradient id="fadeSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" class="bg-stop" stop-opacity=".9"/><stop offset=".05" class="bg-stop" stop-opacity="0"/><stop offset=".95" class="bg-stop" stop-opacity="0"/><stop offset="1" class="bg-stop" stop-opacity=".9"/></linearGradient>
        ${barkDefs}
      </defs>
      <rect width="${VW}" height="${VH}" fill="url(#sky)"/>
      <path class="star" d="${stars}"/>
      <g id="sunG" style="transform:translate(${sunX}px,${sunY}px)">
        <circle class="sun-bloom" r="270" fill="url(#bloom)"/>
        <circle class="sun-disk" r="33"/>
        <circle class="moon-shade" cx="-10" cy="-7" r="7"/><circle class="moon-shade" cx="8" cy="9" r="5"/><circle class="moon-shade" cx="11" cy="-10" r="3"/>
      </g>
      <path class="r1" d="${ridge(420, 38, 260, 1, .0, 0, "r1")}"/>
      <rect y="360" width="${VW}" height="120" fill="url(#hazeBand)"/>
      <path class="r2" d="${ridge(478, 28, 200, 3, .25, 24, "r2")}"/>
      <rect y="430" width="${VW}" height="110" fill="url(#hazeBand)"/>
      <path class="r3" d="${ridge(540, 18, 150, 5, .5, 44, "r3")}"/>
      <rect y="505" width="${VW}" height="100" fill="url(#hazeBand)" opacity=".8"/>
      <path class="r4" d="${ridge(606, 10, 120, 2, .6, 66, "r4")}"/>
      <rect y="580" width="${VW}" height="80" fill="url(#hazeBand)" opacity=".6"/>
      <g id="raysG" style="transform:translate(${sunX}px,${sunY}px)"><path class="rays" d="${rays}" fill="url(#rayg)"/></g>
      <path d="${ground}" fill="url(#gnd)"/>
      <path class="grass gr1" d="${grass[0]}"/>
      <g id="flora">${parts.map(p => p.flora).join("")}</g>
      ${parts.map(p => p.owl).join("")}
      <path class="grass gr2" d="${grass[1]}"/>
      <path class="grass gr3" d="${grass[2]}"/>
      ${flies}
      <rect width="${VW}" height="${VH}" fill="url(#fadeTop)" pointer-events="none"/>
      <rect width="${VW}" height="${VH}" fill="url(#fadeBot)" pointer-events="none"/>
      <rect width="${VW}" height="${VH}" fill="url(#fadeSide)" pointer-events="none"/>
      <g id="over">${parts.map(p => p.over).join("")}</g>
    </svg>
    <div class="mist m1"></div><div class="mist m2"></div>
    <div class="fauna" aria-hidden="true">${faunaHTML()}</div>`;
  }

  // ---------- Fauna: butterflies & dragonflies by day, bats by dusk/night ----------
  function faunaHTML() {
    const r = rng("fauna");
    const px = (lo, hi) => `${f((r() < .5 ? -1 : 1) * (lo + r() * (hi - lo)))}px`;
    const wing = (c1, c2, e) => `<g class="wing"><path d="M0 -1 C-3 -10 -12 -10 -11 -3 C-10 1 -4 1 0 -1Z" fill="${c1}" stroke="${e}" stroke-width=".7"/><path d="M0 0 C-3 3 -9 8 -7 9.5 C-4 10.5 -1 5 0 0Z" fill="${c2}" stroke="${e}" stroke-width=".7"/></g>`;
    let h = "";
    [["#e8862a", "#b9581b", "#2a1d14"], ["#f3efe2", "#e0d9c4", "#6b6458"], ["#7ea9dc", "#4d79b6", "#1f2a3a"], ["#f0cf4a", "#d6a52a", "#3a2d14"], ["#e58a34", "#c0601a", "#2a1d14"], ["#f3efe2", "#e0d9c4", "#6b6458"]]
      .forEach(([c1, c2, e], j) => {
        h += `<div class="cr butterfly" data-when="dawn day" style="left:${f(6 + j * 15.5 + r() * 6)}%;top:${f(50 + r() * 24)}%">
          <div class="path" style="--dur:${f(12 + r() * 9)}s;--dl:${f(-r() * 12)}s;--ax:${px(40, 140)};--ay:${px(15, 60)};--bx:${px(30, 120)};--by:${px(15, 70)};--cx:${px(30, 130)};--cy:${px(10, 50)}">
          <div class="bob"><svg viewBox="-12 -10 24 20" width="${f(17 + r() * 7)}">${wing(c1, c2, e)}<g transform="scale(-1 1)">${wing(c1, c2, e)}</g>
            <path d="M0 -5 L0 6" stroke="#2a2018" stroke-width="1.5" stroke-linecap="round"/><path d="M0 -5 L-2.2 -9 M0 -5 L2.2 -9" stroke="#2a2018" stroke-width=".6"/></svg></div></div></div>`;
      });
    ["#2c7a8c", "#b8452e", "#3d7f45", "#2c7a8c"].forEach((c, j) => {
      const w = `fill="rgba(228,240,248,.5)" stroke="rgba(255,255,255,.75)" stroke-width=".4"`;
      h += `<div class="cr dragonfly" data-when="day dusk" style="left:${f(10 + j * 22 + r() * 8)}%;top:${f(74 + r() * 12)}%">
        <div class="path" style="--dur:${f(9 + r() * 6)}s;--dl:${f(-r() * 9)}s;--ax:${px(50, 140)};--ay:${px(8, 36)};--bx:${px(40, 120)};--by:${px(8, 30)};--cx:${px(40, 140)};--cy:${px(8, 36)}">
        <div class="hover"><svg viewBox="-16 -9 32 18" width="34">
          <g class="dwing"><ellipse cx="-2" cy="-6" rx="1.8" ry="6.5" transform="rotate(-18 -2 -6)" ${w}/><ellipse cx="1.5" cy="-6" rx="1.6" ry="6" transform="rotate(16 1.5 -6)" ${w}/>
          <ellipse cx="-2" cy="6" rx="1.8" ry="6.5" transform="rotate(18 -2 6)" ${w}/><ellipse cx="1.5" cy="6" rx="1.6" ry="6" transform="rotate(-16 1.5 6)" ${w}/></g>
          <path d="M-3 0 L15 0" stroke="${c}" stroke-width="1.7" stroke-linecap="round"/><ellipse cx="-1.5" cy="0" rx="3.2" ry="1.9" fill="${c}"/><circle cx="-5.6" cy="0" r="1.9" fill="#1d3b40"/>
        </svg></div></div></div>`;
    });
    for (let j = 0; j < 5; j++) {
      const bw = `<path d="M0 0 C-3 -5 -9 -6 -13 -2 C-11 -1 -10 1 -8 2 C-7 0 -5 1 -4 2.5 C-3 1 -1 1 0 1Z"/>`;
      h += `<div class="cr bat${j % 2 ? " rev" : ""}" data-when="dusk night" style="top:${f(6 + r() * 26)}%;--dur:${f(15 + r() * 12)}s;--dl:${f(-r() * 20)}s">
        <div class="swoop" style="--sw:${f(2.4 + r() * 2)}s"><svg viewBox="-14 -7 28 14" width="${f(24 + r() * 10)}" fill="#1c1920" stroke="rgba(200,200,225,.35)" stroke-width=".4">
          <g class="bw">${bw}</g><g transform="scale(-1 1)"><g class="bw">${bw}</g></g>
          <ellipse cx="0" cy=".5" rx="1.9" ry="3.1"/><path d="M-1.2 -2.3 L-1.7 -4.4 L-.3 -2.8Z M1.2 -2.3 L1.7 -4.4 L.3 -2.8Z"/>
        </svg></div></div>`;
    }
    return h;
  }

  const forest = $("#forest"), scene = $("#scene");
  scene.innerHTML = sceneSVG();
  const floras = [...scene.querySelectorAll(".flora")];
  const ovs = [...scene.querySelectorAll(".ov")];

  // hover: fade the canopy, reveal the skeleton
  let current = -1;
  function setActive(i, on) {
    if (!on && i === current) return;
    ovs[i].classList.toggle("active", on);
    floras[i].classList.toggle("fade", on);
  }
  ovs.forEach((o, i) => {
    o.addEventListener("pointerenter", () => setActive(i, true));
    o.addEventListener("pointerleave", () => setActive(i, false));
    o.addEventListener("focus", () => setActive(i, true));
    o.addEventListener("blur", () => setActive(i, false));
  });

  // ---------- Registry rows ----------
  const rowsEl = $("#rows");
  rowsEl.innerHTML = APPS.map(a => {
    const sp = SPECIES[a.sp];
    return `<button class="row" data-id="${a.id}" style="--leaf:${a.leaf}" aria-label="${esc(a.name)} — 打開觀察筆記">
      <span class="swatch">${esc(a.glyph)}</span>
      <span class="meta"><div class="name">${esc(a.name)}</div><div class="sub">${esc(a.sub)} · ${sp.zh} <i>${sp.latin}</i></div></span>
      <span class="right"><span class="status" data-id="${a.id}" data-s="pending"><i></i><span>檢查中</span></span><span class="pill">${esc(a.cat)}</span></span>
    </button>`;
  }).join("");
  const rows = [...rowsEl.children];

  // ---------- Filter ----------
  const chips = $("#chips"), q = $("#q");
  const cats = ["全部", ...new Set(APPS.map(a => a.cat))];
  let activeCat = "全部";
  chips.innerHTML = cats.map(c => {
    const n = c === "全部" ? APPS.length : APPS.filter(a => a.cat === c).length;
    return `<button class="chip" aria-pressed="${c === activeCat}" data-cat="${c}">${c}<span class="count">${n}</span></button>`;
  }).join("");
  chips.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    activeCat = b.dataset.cat;
    chips.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b));
    applyFilter();
  });
  q.addEventListener("input", applyFilter);
  const haystack = a => [a.name, a.sub, a.cat, SPECIES[a.sp].zh, SPECIES[a.sp].latin, a.desc, ...a.branches.flat(2)].join(" ").toLowerCase();

  function centerOn(i) {
    if (forest.scrollWidth <= forest.clientWidth) return;
    const box = ovs[i].querySelector(".hit").getBoundingClientRect(), fb = forest.getBoundingClientRect();
    forest.scrollBy({ left: box.left + box.width / 2 - fb.left - fb.width / 2, behavior: reduce ? "auto" : "smooth" });
  }

  function applyFilter() {
    const term = q.value.trim().toLowerCase();
    let shown = 0, firstHit = null;
    APPS.forEach((a, i) => {
      const ok = (activeCat === "全部" || a.cat === activeCat) && (!term || haystack(a).includes(term));
      floras[i].classList.toggle("dim", !ok);
      ovs[i].classList.toggle("dim", !ok);
      rows[i].classList.toggle("hidden", !ok);
      if (ok) { shown++; if (firstHit === null) firstHit = i; }
    });
    $("#empty").classList.toggle("show", shown === 0);
    $("#emptyQ").textContent = q.value;
    if (firstHit !== null && (term || activeCat !== "全部")) centerOn(firstHit);
  }

  // ---------- Journal ----------
  const journal = $("#journal"), scrim = $("#scrim"), jBody = $("#jBody");
  let lastFocus = null;
  const icon = {
    arrow: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>`,
    copy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>`,
  };
  const statusOf = {};

  function renderJournal(i) {
    const a = APPS[i], sp = SPECIES[a.sp], host = new URL(a.url).host;
    const st = statusOf[a.id] || "pending";
    journal.style.cssText = `--leaf:${a.leaf}`;
    $("#jKicker").textContent = `觀察筆記 · ${String(i + 1).padStart(2, "0")} / ${String(APPS.length).padStart(2, "0")}`;
    let d = 0;
    jBody.innerHTML = `
      <div class="j-latin">${esc(sp.latin)} · ${sp.zh}</div>
      <h2 id="jTitle">${esc(a.name)}</h2>
      <div class="j-sub">${esc(a.sub)}</div>
      <div class="j-meta">
        <span class="pill">${esc(a.cat)}</span>
        <span class="status" data-s="${st}"><i></i><span>${{ up: "在線", down: "離線", pending: "檢查中" }[st]}</span></span>
      </div>
      <p class="j-desc">${esc(a.desc)}</p>
      <h3 class="j-h">科技樹 · ${a.branches.length} 條枝、${leafCount(a)} 個枝梢</h3>
      <div class="tt">
        <div class="tt-root"><span class="dot"></span>${esc(a.name)}</div>
        ${a.branches.map(([b, fs]) => `<div class="tt-br"><div class="tt-bn">${esc(b)}</div><div class="tt-lv">${fs.map(x => `<span style="animation-delay:${(d++) * 35}ms">${esc(x)}</span>`).join("")}</div></div>`).join("")}
      </div>
      <div class="j-actions">
        <a class="btn primary" href="${a.url}" target="_blank" rel="noopener">走進這棵樹 ${icon.arrow}</a>
        <button class="btn" id="jCopy" aria-label="複製網址" title="複製網址">${icon.copy}</button>
      </div>
      <div class="domain">${esc(host)}${a.lock ? " · 需密碼" : ""}</div>`;
    $("#jCopy").onclick = async () => {
      try { await navigator.clipboard.writeText(a.url); showToast("已複製網址 ✓"); }
      catch { showToast("無法複製，請手動複製"); }
    };
    jBody.scrollTop = 0;
  }

  function openTree(i) {
    if (current === -1) lastFocus = document.activeElement;
    const prev = current;
    current = i;
    if (prev !== -1 && prev !== i) setActive(prev, false);
    setActive(i, true);
    renderJournal(i);
    journal.classList.add("open"); journal.setAttribute("aria-hidden", "false");
    scrim.classList.add("open");
    history.replaceState(null, "", `#${APPS[i].id}`);
    centerOn(i);
    setTimeout(() => $("#jClose").focus({ preventScroll: true }), 50);
  }
  function closeTree() {
    if (current === -1) return;
    const i = current; current = -1;
    setActive(i, false);
    journal.classList.remove("open"); journal.setAttribute("aria-hidden", "true");
    scrim.classList.remove("open");
    history.replaceState(null, "", location.pathname + location.search);
    lastFocus && lastFocus.focus && lastFocus.focus({ preventScroll: true });
  }
  const step = d => openTree((current + d + APPS.length) % APPS.length);

  ovs.forEach((o, i) => {
    o.addEventListener("click", () => openTree(i));
    o.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openTree(i); } });
  });
  rows.forEach((row, i) => row.addEventListener("click", () => openTree(i)));
  scrim.addEventListener("click", closeTree);
  $("#jClose").addEventListener("click", closeTree);
  $("#jPrev").addEventListener("click", () => step(-1));
  $("#jNext").addEventListener("click", () => step(1));

  addEventListener("keydown", e => {
    if (current !== -1) {
      if (e.key === "Escape") closeTree();
      else if (e.key === "ArrowLeft") step(-1);
      else if (e.key === "ArrowRight") step(1);
      return;
    }
    if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    else if (e.key === "Escape" && document.activeElement === q) { q.value = ""; applyFilter(); q.blur(); }
  });

  // drag to pan the forest with a mouse
  let drag = null;
  forest.addEventListener("pointerdown", e => { if (e.pointerType === "mouse" && forest.scrollWidth > forest.clientWidth) drag = { x: e.clientX, s: forest.scrollLeft, moved: false }; });
  addEventListener("pointermove", e => { if (!drag) return; const dx = e.clientX - drag.x; if (Math.abs(dx) > 4) drag.moved = true; forest.scrollLeft = drag.s - dx; });
  addEventListener("pointerup", () => { if (drag && drag.moved) forest.addEventListener("click", ev => ev.stopPropagation(), { capture: true, once: true }); drag = null; });

  // ---------- Toast ----------
  const toast = $("#toast"); let tt;
  function showToast(msg) { toast.textContent = msg; toast.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove("show"), 1800); }

  // ---------- Status check ----------
  let up = 0, done = 0;
  APPS.forEach((a, i) => {
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 8000);
    const set = s => {
      statusOf[a.id] = s;
      ovs[i].dataset.s = s;
      document.querySelectorAll(`.status[data-id="${a.id}"]`).forEach(el => { el.dataset.s = s; el.lastChild.textContent = s === "up" ? "在線" : "離線"; });
      if (current === i) renderJournal(i);
    };
    fetch(a.url, { mode: "no-cors", cache: "no-store", signal: ctrl.signal })
      .then(() => { set("up"); up++; })
      .catch(() => set("down"))
      .finally(() => { clearTimeout(to); if (++done === APPS.length) countTo($("#upCount"), up); });
  });

  function countTo(el, n) {
    if (reduce) { el.textContent = n; return; }
    const t0 = performance.now(), d = 900;
    const tick = t => { const p = Math.min(1, (t - t0) / d); el.textContent = Math.round(n * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }
  setTimeout(() => { countTo($("#nTrees"), APPS.length); countTo($("#nLeaves"), APPS.reduce((n, a) => n + leafCount(a), 0)); }, 300);

  // ---------- Time of day ----------
  // 自動模式跟著訪客的時鐘：日出 5–7:30、白天到 16:30、日落到 19:00、其餘是夜晚
  const root = document.documentElement, meta = $('meta[name="theme-color"]');
  const PHASES = { dawn: { h: 7.2, zh: "日出" }, day: { h: 12.5, zh: "白天" }, dusk: { h: 16.9, zh: "日落" }, night: { h: 22, zh: "夜晚" } };
  const phaseOf = h => h >= 5 && h < 7.5 ? "dawn" : h >= 7.5 && h < 16.5 ? "day" : h >= 16.5 && h < 19 ? "dusk" : "night";
  const sunG = $("#sunG"), raysG = $("#raysG"), shadows = [...scene.querySelectorAll(".tshadow")];
  let mode = (() => { try { return localStorage.getItem("phase") || "auto"; } catch { return "auto"; } })();
  if (mode !== "auto" && !PHASES[mode]) mode = "auto";

  function placeSky(h, phase) {
    let x, y, height;
    if (phase === "night") { // moon arc from 19:00 to 05:00
      const t = (((h - 19) % 24) + 24) % 24 / 10;
      x = VW * (.1 + .8 * t); y = 440 - 320 * Math.sin(Math.PI * clamp(t, 0, 1)); height = .3;
    } else { // sun arc from 06:00 to 18:00
      const t = clamp((h - 6) / 12, -.04, 1.04);
      x = VW * (.06 + .88 * t); height = Math.sin(Math.PI * clamp(t, 0, 1));
      y = 472 - 345 * height;
    }
    sunG.style.transform = `translate(${f(x)}px,${f(y)}px)`;
    const ang = Math.atan2(700 - y, VW / 2 - x) * 180 / Math.PI - 90;
    raysG.style.transform = `translate(${f(x)}px,${f(y)}px) rotate(${f(ang)}deg)`;
    // shadows fall away from the light and stretch when it is low
    const low = 1 - height;
    shadows.forEach(s => {
      const bx = +s.dataset.x, brx = +s.dataset.rx;
      const dx = phase === "night" ? 6 : clamp((bx - x) * (.12 + .3 * low), -130, 130);
      s.style.cx = `${f(bx + dx)}px`;
      s.style.rx = `${f(brx * (1 + low * .7))}px`;
    });
  }

  function applyTime() {
    const now = new Date(), hNow = now.getHours() + now.getMinutes() / 60;
    const phase = mode === "auto" ? phaseOf(hNow) : mode;
    const h = mode === "auto" ? hNow : PHASES[mode].h;
    root.dataset.phase = phase;
    root.dataset.theme = phase === "night" ? "dark" : "light";
    meta.content = phase === "night" ? "#0b1210" : "#f2eee4";
    placeSky(h, phase);
    const hhmm = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
    $("#phaseLabel").textContent = mode === "auto" ? `${hhmm} · ${PHASES[phase].zh}` : PHASES[phase].zh;
    document.querySelectorAll("#phaseCtl button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
  }
  $("#phaseCtl").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    mode = b.dataset.mode;
    try { localStorage.setItem("phase", mode); } catch {}
    applyTime();
  });
  // first paint without the slow transitions, then keep the clock ticking
  sunG.style.transition = raysG.style.transition = "none";
  applyTime();
  requestAnimationFrame(() => requestAnimationFrame(() => { sunG.style.transition = raysG.style.transition = ""; }));
  setInterval(() => { if (mode === "auto") applyTime(); }, 60000);

  const nav = $("#nav");
  addEventListener("scroll", () => nav.classList.toggle("scrolled", scrollY > 8), { passive: true });
  $("#yr").textContent = new Date().getFullYear();

  const hashI = APPS.findIndex(a => a.id === location.hash.slice(1));
  if (hashI >= 0) setTimeout(() => openTree(hashI), 600);
})();
</script>
</body>
</html>
